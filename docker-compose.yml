services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://repolens:repolens@postgres:5432/repolens
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5-coder:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBED_DOC_PREFIX: "${EMBED_DOC_PREFIX:-search_document: }"
      EMBED_QUERY_PREFIX: "${EMBED_QUERY_PREFIX:-search_query: }"
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      ASK_TOP_K: ${ASK_TOP_K:-8}
      ASK_LOG_ENABLED: ${ASK_LOG_ENABLED:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://repolens:repolens@postgres:5432/repolens
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5-coder:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBED_DOC_PREFIX: "${EMBED_DOC_PREFIX:-search_document: }"
      EMBED_QUERY_PREFIX: "${EMBED_QUERY_PREFIX:-search_query: }"
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      MAX_REPO_SIZE_BYTES: ${MAX_REPO_SIZE_BYTES:-52428800}
      MAX_FILE_COUNT: ${MAX_FILE_COUNT:-2000}
      REPOS_DATA_DIR: /data/repos
    volumes:
      - repos_data:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  repos_data:
